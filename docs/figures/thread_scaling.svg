<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="540" fill="#FFFFFF"/>
  <line x1="92" y1="470" x2="832" y2="470" stroke="#D9D9D9" stroke-width="0.8"/>
  <text x="84" y="474" font-size="11" fill="#6A6A6A" text-anchor="end">0</text>
  <line x1="92" y1="380.5" x2="832" y2="380.5" stroke="#D9D9D9" stroke-width="0.8"/>
  <text x="84" y="384.5" font-size="11" fill="#6A6A6A" text-anchor="end">4</text>
  <line x1="92" y1="291" x2="832" y2="291" stroke="#D9D9D9" stroke-width="0.8"/>
  <text x="84" y="295" font-size="11" fill="#6A6A6A" text-anchor="end">9</text>
  <line x1="92" y1="201.5" x2="832" y2="201.5" stroke="#D9D9D9" stroke-width="0.8"/>
  <text x="84" y="205.5" font-size="11" fill="#6A6A6A" text-anchor="end">13</text>
  <line x1="92" y1="112" x2="832" y2="112" stroke="#D9D9D9" stroke-width="0.8"/>
  <text x="84" y="116" font-size="11" fill="#6A6A6A" text-anchor="end">17</text>
  <line x1="92" y1="470" x2="832" y2="470" stroke="#B9B9B9" stroke-width="1.2"/>
  <line x1="92" y1="112" x2="92" y2="470" stroke="#B9B9B9" stroke-width="1.2"/>
  <line x1="92" y1="470" x2="777.19" y2="138.52" stroke="#8A8A8A" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="769.19" y="156.52" font-size="11" fill="#8A8A8A" text-anchor="end">perfect linear scaling</text>
  <line x1="134.82" y1="449.28" x2="777.19" y2="263.31" stroke="#B5553D" stroke-width="2.4"/>
  <circle cx="134.82" cy="449.28" r="6" fill="#B5553D" stroke="#FFFFFF" stroke-width="1.4"/>
  <circle cx="777.19" cy="263.31" r="7" fill="#B5553D" stroke="#FFFFFF" stroke-width="1.4"/>
  <text x="767.19" y="251.31" font-size="12" fill="#B5553D" text-anchor="end" font-weight="600">measured 9.98x on 16 threads</text>
  <line x1="92" y1="470" x2="92" y2="475" stroke="#B9B9B9" stroke-width="1"/>
  <text x="92" y="490" font-size="11" fill="#6A6A6A" text-anchor="middle">0</text>
  <line x1="263.3" y1="470" x2="263.3" y2="475" stroke="#B9B9B9" stroke-width="1"/>
  <text x="263.3" y="490" font-size="11" fill="#6A6A6A" text-anchor="middle">4</text>
  <line x1="434.59" y1="470" x2="434.59" y2="475" stroke="#B9B9B9" stroke-width="1"/>
  <text x="434.59" y="490" font-size="11" fill="#6A6A6A" text-anchor="middle">8</text>
  <line x1="605.89" y1="470" x2="605.89" y2="475" stroke="#B9B9B9" stroke-width="1"/>
  <text x="605.89" y="490" font-size="11" fill="#6A6A6A" text-anchor="middle">12</text>
  <line x1="777.19" y1="470" x2="777.19" y2="475" stroke="#B9B9B9" stroke-width="1"/>
  <text x="777.19" y="490" font-size="11" fill="#6A6A6A" text-anchor="middle">16</text>
  <text x="462" y="524" font-size="12" fill="#2B2B2B" text-anchor="middle">threads</text>
  <text x="16" y="98" font-size="12" fill="#2B2B2B" text-anchor="start">speedup</text>
  <text x="92" y="36" font-size="16" fill="#2B2B2B" text-anchor="start" font-weight="600">Parallel speedup, reported as measured rather than as advertised</text>
  <text x="92" y="58" font-size="12" fill="#6A6A6A" text-anchor="start">400,000 paths: 2.41 s on one thread, 0.24 s on 16.</text>
  <text x="92" y="78" font-size="12" fill="#2B2B2B" text-anchor="start">The gap to the dashed line is hyperthreading and memory bandwidth. 9.98x of a possible 16x is the honest number for an</text>
  <text x="92" y="95" font-size="12" fill="#2B2B2B" text-anchor="start">embarrassingly-parallel workload on this hardware, and it is the one quoted.</text>
