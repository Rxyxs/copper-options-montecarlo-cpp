name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libstdc++'s <execution> parallel policies (std::execution::par_unseq in
      # MonteCarloEngine.h) need TBB as their backend on GCC/Clang.
      - name: Install TBB
        run: sudo apt-get update && sudo apt-get install -y libtbb-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
